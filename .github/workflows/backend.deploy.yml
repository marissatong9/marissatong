name: Backend Deploy

# Builds the API, uploads the jar to S3, then uses AWS Systems Manager (SSM) to
# swap it in on the EC2 instance and restart the service. No SSH or stored AWS keys:
# GitHub gets short-lived AWS credentials through OIDC.
on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.deploy.yml
      - "!**/*.md"
      - "!**/.gitignore"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to request the OIDC token for AWS

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  JAR_PATH: backend/target/portfolio-api-0.0.1-SNAPSHOT.jar
  HEALTH_URL: https://api.marissatong.dev/actuator/health

jobs:
  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Same checks as CI. If they fail, nothing is deployed.
      - name: Check formatting, run tests and build the jar
        working-directory: backend
        run: ./mvnw -B spotless:check verify

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload jar to S3
        id: upload
        run: |
          KEY="portfolio-api-${GITHUB_SHA}.jar"
          aws s3 cp "$JAR_PATH" "s3://${{ vars.DEPLOY_BUCKET }}/$KEY" --only-show-errors
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Swap the jar and restart the service on EC2
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          KEY: ${{ steps.upload.outputs.key }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # This script runs on the instance (as root) through SSM.
          cat > remote.sh <<EOF
          set -eu
          cd /home/ec2-user
          aws s3 cp "s3://${BUCKET}/${KEY}" app.jar.new --region ${AWS_REGION} --only-show-errors
          chown ec2-user:ec2-user app.jar.new
          if [ -f app.jar ]; then cp -p app.jar app.jar.prev; fi
          mv app.jar.new app.jar
          systemctl restart portfolio

          # Wait up to 2.5 minutes for the app to report UP. Roll back if it doesn't.
          for i in \$(seq 1 30); do
            if curl -fsS localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Deployed ${KEY} and the app is healthy."
              exit 0
            fi
            sleep 5
          done

          echo "App did not become healthy. Rolling back to the previous jar."
          if [ -f app.jar.prev ]; then
            cp -p app.jar.prev app.jar
            systemctl restart portfolio
          fi
          exit 1
          EOF

          jq -n --rawfile script remote.sh \
            '{commands: ($script | split("\n")), executionTimeout: ["600"]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes (up to 5 minutes).
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "Status: $STATUS"
          echo "--- Output from the instance ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$STATUS" = "Success" ]

      - name: Check the public health endpoint
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$HEALTH_URL"
