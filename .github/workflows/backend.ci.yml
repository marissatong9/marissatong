name: Backend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel previous runs on same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
              - '.github/workflows/backend.ci.yml'

  backend-format:
    name: Backend format
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B spotless:check

  backend-test:
    name: Backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Tests start their own throwaway Postgres with Testcontainers (Docker is built into the runner)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  # The one check to mark as required in branch protection.
  backend-ci-passed:
    name: Backend CI passed
    needs: [changes, backend-format, backend-test]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail if any backend job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All backend checks passed or were skipped."
